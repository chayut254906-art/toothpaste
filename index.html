<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshSmile — ยาสีฟันสูตรพรีเมียม</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>FreshSmile ยาสีฟัน</h1>
      <nav class="nav-links">
        <a href="index.html" class="active">หน้าร้าน</a>
        <a href="admin.html">หลังบ้าน (หยิบ/แพ็ค/จ่าหน้า)</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>ยาสีฟันสูตรเข้มข้น ลมหายใจหอมสดชื่นตลอดวัน</h2>
      <p>เลือกสูตรที่ใช่สำหรับคุณ ส่งตรงถึงบ้าน รวดเร็ว แพ็คอย่างดี</p>
    </section>

    <section>
      <h3 class="section-title">สินค้าของเรา (2 สูตรขายดี)</h3>
      <div class="product-grid" id="productList"></div>
    </section>

    <section class="card-box">
      <h3 class="section-title" style="margin-top:0;">ฟอร์มสั่งซื้อและที่อยู่จัดส่ง</h3>
      <div class="summary-bar" id="cartSummary">
        ยังไม่ได้เลือกสินค้า (กรุณากดปุ่ม + เพื่อเลือกจำนวน)
      </div>

      <form id="orderForm">
        <div class="form-group">
          <label for="custName">ชื่อ-นามสกุล ผู้รับ *</label>
          <input type="text" id="custName" required placeholder="เช่น สมชาย ใจดี" />
        </div>
        <div class="form-group">
          <label for="custPhone">เบอร์โทรศัพท์ *</label>
          <input type="tel" id="custPhone" required placeholder="เช่น 0812345678" />
        </div>
        <div class="form-group">
          <label for="custAddress">ที่อยู่จัดส่ง (บ้านเลขที่ / ถนน / แขวง-ตำบล / เขต-อำเภอ / จังหวัด) *</label>
          <textarea id="custAddress" rows="3" required placeholder="กรอกที่อยู่ให้ครบถ้วนเพื่อความถูกต้องในการจ่าหน้าพัสดุ"></textarea>
        </div>
        <div class="form-group">
          <label for="custZip">รหัสไปรษณีย์ *</label>
          <input type="text" id="custZip" required maxlength="5" placeholder="เช่น 10510" />
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">ยืนยันการสั่งซื้อ</button>
      </form>
    </section>
  </main>

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbx-TheebtMLBjbomBog2Fyw3tKG3DRIWlEgwIpeIJ2iirmsQ-9o56YXy6iedj91jcr1LA/exec';

    const PRODUCTS = [
      {
        sku: 'TP-HERB-01',
        name: 'เฮอร์เบิล เฟรช (สูตรสมุนไพรธรรมชาติ)',
        desc: 'ลดกลิ่นปาก ดูแลสุขภาพเหงือกและฟันด้วยสารสกัดสมุนไพรแท้ ขนาด 100 กรัม',
        price: 129,
        img: 'images/herbal-fresh.jpg'
      },
      {
        sku: 'TP-COOL-02',
        name: 'ไวท์ แอนด์ คูล (สูตรฟันขาวเย็นสดชื่น)',
        desc: 'ขจัดคราบพลัคเพื่อฟันขาวสะอาด พร้อมความเย็นสดชื่นยาวนาน ขนาด 100 กรัม',
        price: 149,
        img: 'images/white-cool.jpg'
      }
    ];

    const cart = { 'TP-HERB-01': 0, 'TP-COOL-02': 0 };

    function renderProducts() {
      const el = document.getElementById('productList');
      el.innerHTML = PRODUCTS.map(p => `
        <div class="product-card">
          <img src="${p.img}" alt="${p.name}" />
          <div class="product-body">
            <span class="sku-badge">SKU: ${p.sku}</span>
            <h4>${p.name}</h4>
            <p class="desc">${p.desc}</p>
            <div class="price">฿${p.price}</div>
            <div class="qty-control">
              <button type="button" onclick="changeQty('${p.sku}', -1)">-</button>
              <span id="qty-${p.sku}">${cart[p.sku]}</span>
              <button type="button" onclick="changeQty('${p.sku}', 1)">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function changeQty(sku, delta) {
      cart[sku] = Math.max(0, (cart[sku] || 0) + delta);
      document.getElementById('qty-' + sku).textContent = cart[sku];
      updateSummary();
    }

    function getSelectedItems() {
      return PRODUCTS
        .filter(p => cart[p.sku] > 0)
        .map(p => ({ sku: p.sku, name: p.name, qty: cart[p.sku], price: p.price }));
    }

    function updateSummary() {
      const items = getSelectedItems();
      const box = document.getElementById('cartSummary');
      if (items.length === 0) {
        box.innerHTML = 'ยังไม่ได้เลือกสินค้า (กรุณากดปุ่ม + เพื่อเลือกจำนวน)';
        return;
      }
      const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);
      box.innerHTML = items.map(i => `• [${i.sku}] ${i.name} x ${i.qty} = ฿${i.qty * i.price}`).join('<br>')
        + `<hr class="divider"><strong>ยอดรวมทั้งหมด: ฿${total}</strong>`;
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const items = getSelectedItems();
      if (items.length === 0) {
        alert('กรุณาเลือกยาสีฟันอย่างน้อย 1 ชิ้นครับ');
        return;
      }

      const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);
      const payload = {
        action: 'order',
        name: document.getElementById('custName').value.trim(),
        phone: document.getElementById('custPhone').value.trim(),
        address: document.getElementById('custAddress').value.trim(),
        zip: document.getElementById('custZip').value.trim(),
        items: items,
        total: total
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึกคำสั่งซื้อ...';

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          alert('สั่งซื้อสำเร็จ! รหัสออเดอร์ของคุณคือ: ' + data.orderId);
          document.getElementById('orderForm').reset();
          PRODUCTS.forEach(p => { cart[p.sku] = 0; });
          renderProducts();
          updateSummary();
        } else {
          alert('เกิดข้อผิดพลาด: ' + JSON.stringify(data));
        }
      } catch (err) {
        alert('ไม่สามารถเชื่อมต่อระบบได้: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'ยืนยันการสั่งซื้อ';
      }
    });

    renderProducts();
  </script>
</body>
</html>
